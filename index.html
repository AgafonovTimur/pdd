<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр дорожных знаков</title>
<style>
  :root{
    --bg: #141414;
    --tile: #171717;
    --tile-text: #D0D0D0;
    --shadow-color: #303030;
    --flash-correct-color: #b3ffb3;
    --flash-correct-opacity: 50%;
    --flash-wrong-color: #ffcccc;
    --flash-wrong-opacity: 50%;

    /* ============================================================
       1) НАДПИСИ ПРИ НЕПРАВИЛЬНОМ ОТВЕТЕ (название / описание / кнопка «далее»)
       Каждый блок — независимый прямоугольник с абсолютным положением
       относительно левого верхнего угла экрана (left/top в px).
       Ничего не привязано к центру, друг к другу или к краям — все три
       блока можно двигать и менять по отдельности.
       ============================================================ */

    /* --- Единый блок «Название + Описание» знака (#answerInfo) ---
       Название и описание теперь один прямоугольник, текст
       выровнен по центру (по горизонтали), при нехватке места
       блок прокручивается по вертикали, а не обрезает текст. */
    --answer-info-top: 300px;            /* отступ от верха экрана, px */
    --answer-info-left: 1600px;         /* отступ от левого края экрана, px */
    --answer-info-width: 430px;
    --answer-info-max-height: 260px;    /* максимальная высота, дальше — скролл */
    --answer-info-gap: 8px;             /* расстояние между названием и описанием */
    --answer-info-padding: 8px 12px;

    --answer-name-font-size: 26px;
    --answer-name-text-color: #D0D0D0;

    --answer-desc-font-size: 20px;
    --answer-desc-text-color: #D0D0D0;

    /* --- Кнопка «Далее» (#nextBtn) --- */
    --next-btn-top: 700px;
    --next-btn-left: 1770px;
    --next-btn-width: 150px;
    --next-btn-height: 80px;
    --next-btn-font-size: 30px;
    --next-btn-text-color: #D0D0D0;
    --next-btn-bg-color: #202020;
    --next-btn-text-align: center;
    --next-btn-padding: 6px 12px;

    /* ============================================================
       2) ОКНО НАСТРОЕК (появляется по скроллу вверх) — #settingsPanel
       ============================================================ */
    --settings-panel-width: 400px;
    --settings-panel-height: 400px;    /* фиксированная высота окна (px) */
    --settings-panel-padding: 24px;
    --settings-panel-top: 0px;         /* смещение окна от центра экрана по вертикали, px */
    --settings-panel-left: 0px;        /* смещение окна от центра экрана по горизонтали, px */
    --cat-tile-height: 44px;
    --cat-tile-min-width: 90px;
    --cat-tile-font-size: 15px;

    /* ============================================================
       3) ГЛАВНЫЙ ЭКРАН (знак + варианты ответов) — #quizScreen
       ============================================================ */
    --sign-box-width: 370px;
    --sign-box-height: 370px;
    --sign-box-top: 0px;               /* смещение блока знака от центра экрана по вертикали, px */
    --sign-box-left: 0px;              /* смещение блока знака от центра экрана по горизонтали, px */
    --quiz-gap: 28px;                  /* расстояние между знаком и сеткой ответов, px */

    --options-grid-width: 700px;
    --opt-tile-height: 64px;
    --opt-tile-font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--tile-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden;
  }

  /* ===== Панель настроек (появляется поверх знака по скроллу) ===== */
  #settingsOverlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  #settingsOverlay.open{
    opacity:1;
    pointer-events:auto;
  }
  #settingsPanel{
    background:var(--bg);
    border-radius:16px;
    box-shadow:0 10px 30px var(--shadow-color);
    padding:var(--settings-panel-padding);
    width:var(--settings-panel-width);
    height:var(--settings-panel-height);
    overflow-y:auto;
    transform:translate(var(--settings-panel-left), var(--settings-panel-top)) scale(.96);
    transition:transform .2s ease;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  #settingsOverlay.open #settingsPanel{
    transform:translate(var(--settings-panel-left), var(--settings-panel-top)) scale(1);
  }
  #catGrid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .cat-tile{
    background:var(--tile);
    color:var(--tile-text);
    border:none;
    border-radius:10px;
    padding:12px 18px;
    height:var(--cat-tile-height);
    min-width:var(--cat-tile-min-width);
    font-size:var(--cat-tile-font-size);
    cursor:pointer;
    box-shadow:0 3px 0 var(--shadow-color);
    user-select:none;
  }
  .cat-tile.active{
    color:#fff;
  }

  /* ===== Экран вопроса ===== */
  #quizScreen{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:var(--quiz-gap);
    padding:20px;
    transform:translate(var(--sign-box-left), var(--sign-box-top));
  }
  #signBox{
    width:var(--sign-box-width);
    height:var(--sign-box-height);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #signBox img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }
  #optionsGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:var(--options-grid-width);
  }
  .opt-tile{
    background:var(--tile);
    color:var(--tile-text);
    border:none;
    border-radius:10px;
    padding:18px 10px;
    min-height:var(--opt-tile-height);
    font-size:var(--opt-tile-font-size);
    cursor:pointer;
    box-shadow:0 3px 0 var(--shadow-color);
    text-align:center;
  }
  .opt-tile.flash-correct{
    background-color: color-mix(in srgb, var(--flash-correct-color) var(--flash-correct-opacity), var(--tile));
    color:#1a1a1a;
  }
  .opt-tile.flash-wrong{
    background-color: color-mix(in srgb, var(--flash-wrong-color) var(--flash-wrong-opacity), var(--tile));
    color:#1a1a1a;
  }
  .opt-tile:disabled{
    cursor:default;
  }

  /* ===== Надпись при неправильном ответе (название + описание в одном блоке) =====
     Единый прямоугольник #answerInfo, текст выровнен по центру
     по горизонтали, содержимое переносится по словам, а если не
     помещается по высоте — появляется вертикальный скролл.
     Кнопка #nextBtn — отдельный независимый блок. */
  #answerInfo,
  #nextBtn{
    position:fixed;
    display:none;
    box-sizing:border-box;
    border:none;
    border-radius:0;
    line-height:1.3;
    z-index:30;
  }
  #answerInfo.show{
    display:flex;
  }
  #nextBtn.show{
    display:flex;
    align-items:center;
  }

  #answerInfo{
    top:var(--answer-info-top);
    left:var(--answer-info-left);
    width:var(--answer-info-width);
    max-height:var(--answer-info-max-height);
    padding:var(--answer-info-padding);
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:var(--answer-info-gap);
    overflow-y:auto;
    text-align:center;
  }
  #answerName{
    width:100%;
    font-size:var(--answer-name-font-size);
    color:var(--answer-name-text-color);
    white-space:normal;
    word-wrap:break-word;
  }
  #answerDesc{
    width:100%;
    font-size:var(--answer-desc-font-size);
    color:var(--answer-desc-text-color);
    white-space:normal;
    word-wrap:break-word;
  }
  #answerDesc:empty{
    display:none !important;
  }

  #nextBtn{
    top:var(--next-btn-top);
    left:var(--next-btn-left);
    width:var(--next-btn-width);
    height:var(--next-btn-height);
    font-size:var(--next-btn-font-size);
    color:var(--next-btn-text-color);
    background:var(--next-btn-bg-color);
    justify-content:var(--next-btn-text-align);
    text-align:var(--next-btn-text-align);
    padding:var(--next-btn-padding);
    cursor:pointer;
    font-family:inherit;
  }

  /* ===== Во время открытых настроек прячем надписи и кнопку «Далее»,
     чтобы они не пересекались с окном настроек ===== */
  body.settings-open #answerInfo,
  body.settings-open #nextBtn{
    display:none !important;
  }
</style>
</head>
<body>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <div id="catGrid"></div>
  </div>
</div>

<div id="quizScreen">
  <div id="signBox"><img id="signImg" src="" alt=""></div>
  <div id="optionsGrid"></div>
</div>

<div id="answerInfo">
  <div id="answerName"></div>
  <div id="answerDesc"></div>
</div>
<button id="nextBtn">Далее</button>

const OPTIONS_COUNT = 4;

let allSigns = [];
let categories = [];
let selectedCats = new Set();
let current = null;

const settingsOverlay = document.getElementById('settingsOverlay');
const settingsPanel = document.getElementById('settingsPanel');
const catGrid = document.getElementById('catGrid');
const signImg = document.getElementById('signImg');
const optionsGrid = document.getElementById('optionsGrid');
const answerInfo = document.getElementById('answerInfo');
const answerName = document.getElementById('answerName');
const answerDesc = document.getElementById('answerDesc');
const nextBtn = document.getElementById('nextBtn');

function openSettings(){
  settingsOverlay.classList.add('open');
  document.body.classList.add('settings-open');
}
function closeSettings(){
  settingsOverlay.classList.remove('open');
  document.body.classList.remove('settings-open');
}
function goNext(){
  answerInfo.classList.remove('show');
  nextBtn.classList.remove('show');
  nextQuestion();
}

init();

async function init(){
  const json = EMBEDDED_DATA;
  allSigns = json.signs;
  categories = json.categories;
  selectedCats = new Set(categories.map(c => c.id));

  renderCategories();
  bindScroll();
  nextQuestion();

  nextBtn.onclick = goNext;

  settingsOverlay.addEventListener('click', (e) => {
    if(e.target === settingsOverlay){
      closeSettings();
    }
  });
}

function renderCategories(){
  catGrid.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tile' + (selectedCats.has(cat.id) ? ' active' : '');
    btn.textContent = cat.label;
    btn.onclick = () => {
      if(selectedCats.has(cat.id)) selectedCats.delete(cat.id);
      else selectedCats.add(cat.id);
      btn.classList.toggle('active');
      nextQuestion();
    };
    catGrid.appendChild(btn);
  });
}

function bindScroll(){
  window.addEventListener('wheel', (e) => {
    if(e.deltaY < 0){
      openSettings();
    }else if(e.deltaY > 0){
      if(settingsOverlay.classList.contains('open')){
        closeSettings();
      }else if(nextBtn.classList.contains('show')){
        goNext();
      }
    }
  }, { passive:true });
}

function getPool(){
  return allSigns.filter(s => selectedCats.has(s.category));
}

function nextQuestion(){
  const pool = getPool();
  if(pool.length < OPTIONS_COUNT) return;

  const correctSign = pool[Math.floor(Math.random() * pool.length)];
  const wrongPool = pool.filter(s => s.id !== correctSign.id);
  shuffle(wrongPool);
  const options = shuffle([correctSign, ...wrongPool.slice(0, OPTIONS_COUNT - 1)]);

  current = { correctSign, options };
  renderQuestion();
}

function renderQuestion(){
  signImg.src = current.correctSign.image;
  optionsGrid.innerHTML = '';
  current.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-tile';
    btn.textContent = opt.name;
    btn.onclick = () => selectAnswer(opt, btn);
    optionsGrid.appendChild(btn);
  });
}

function selectAnswer(opt, btnEl){
  const buttons = [...optionsGrid.querySelectorAll('.opt-tile')];
  buttons.forEach(b => b.disabled = true);

  const isCorrect = opt.id === current.correctSign.id;

  if(isCorrect){
    btnEl.classList.add('flash-correct');
    // просто короткая подсветка и переход к следующему вопросу, без окна
    setTimeout(nextQuestion, 500);
    return;
  }

  btnEl.classList.add('flash-wrong');
  const correctBtn = buttons.find(b => b.textContent === current.correctSign.name);
  if(correctBtn) correctBtn.classList.add('flash-correct');

  answerName.textContent = current.correctSign.name;
  answerDesc.textContent = current.correctSign.description || '';
  answerInfo.classList.add('show');

  nextBtn.classList.add('show');
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
</script>
